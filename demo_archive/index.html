:target{background:#ffe06655}</style><div class="wrap"><h1>Fluffy Workshop (synthetic test server)</h1><div class="sub">Read-only archive · names pseudonymized · works offline</div><p><input id="q" placeholder="Search all messages (author or text)..." oninput="go()"></p><div id="res"></div><h2>Channels</h2><ul><li><a href="commissions-1.html">#commissions</a> <span class="sub">137 messages · 2025-06-01 → 2025-07-03</span></li><li><a href="con-planning-1.html">#con-planning</a> <span class="sub">82 messages · 2025-06-01 → 2025-06-20</span></li><li><a href="general-1.html">#general</a> <span class="sub">372 messages · 2025-06-01 → 2025-09-02</span></li></ul></div><script src="search_index.js"></script><script>function go(){const q=document.getElementById('q').value.toLowerCase().trim();const box=document.getElementById('res');if(q.length<2){box.innerHTML='';return}
const w=q.split(/\s+/);const hits=SEARCH.filter(r=>w.every(x=>(r[4]+' '+r[5]).toLowerCase().includes(x))).slice(0,200);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
box.innerHTML='<div class=sub>'+hits.length+(hits.length==200?'+':'')+' results</div>'+hits.map(r=>`<div class=hit><a href="${r[0]}-${r[1]}.html#m${r[2]}">#${r[0]}</a> <span class=sub>${r[3]} · ${esc(r[4])}</span><div>${esc(r[5]).replace(new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>')}</div></div>`).join('')}</script>
